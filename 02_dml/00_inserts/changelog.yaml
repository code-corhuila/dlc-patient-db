databaseChangeLog:
  - changeSet:
      id: patients-dml-synthetic-001
      author: DanielPerez1822
      context: "(@dev or @qa) and !prod"
      labels: "synthetic-seeds,dml"
      comment: "Explicit non-production synthetic snapshots; no lifecycle events."
      runInTransaction: true
      validCheckSum:
        - "9:628ec48ca036cbf98296ebcde6d81f70"
        - "9:b0a3b4a2d6739ebfd9b2e87add0b8f2e"
      changes:
        - sqlFile:
            path: 001_synthetic_patients.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/02_dml/00_inserts/001_synthetic_patients.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: patients-dml-synthetic-002
      author: DanielPerez1822
      context: "(@dev or @qa) and !prod"
      labels: "synthetic-seeds,dml"
      comment: "Removes the synthetic snapshots so dev/qa hold only data registered through the API."
      runInTransaction: true
      changes:
        - sqlFile:
            path: 002_remove_synthetic_patients.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: 001_synthetic_patients.sql
            relativeToChangelogFile: true
            splitStatements: false
