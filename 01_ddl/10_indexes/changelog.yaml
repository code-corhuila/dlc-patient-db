databaseChangeLog:
  - changeSet:
      id: patients-ddl-indexes-001
      author: DanielPerez1822
      labels: "HU-PAT-001,PAT-001,ddl,indexes"
      comment: "Normalized document uniqueness across all statuses; initial table has no production data."
      changes:
        - sqlFile:
            path: 001_patients_document.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/10_indexes/001_patients_document.rollback.sql
            relativeToChangelogFile: true
  - changeSet:
      id: patients-ddl-indexes-002
      author: DanielPerez1822
      labels: "HU-PAT-001,emergency-contacts,ddl,indexes"
      comment: "Index the local patient reference on the newly created contacts table."
      changes:
        - sqlFile:
            path: 002_emergency_contacts_patient.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/10_indexes/002_emergency_contacts_patient.rollback.sql
            relativeToChangelogFile: true
  - changeSet:
      id: patients-ddl-indexes-003
      author: DanielPerez1822
      labels: "HU-PAT-001,patient-audit,ddl,indexes"
      comment: "Support local patient audit lookup on the newly created audit table."
      changes:
        - sqlFile:
            path: 003_patient_audit_history.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/10_indexes/003_patient_audit_history.rollback.sql
