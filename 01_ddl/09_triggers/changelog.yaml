databaseChangeLog:
  - changeSet:
      id: patients-ddl-triggers-001
      author: DanielPerez1822
      labels: "HU-PAT-001,PAT-001,ddl,triggers"
      comment: "Protect external patient references; unchanged identifiers remain valid."
      changes:
        - sqlFile:
            path: 001_patients_identity_immutable.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/09_triggers/001_patients_identity_immutable.rollback.sql
            relativeToChangelogFile: true
  - changeSet:
      id: patients-ddl-triggers-002
      author: DanielPerez1822
      labels: "HU-PAT-001,patient-audit,ddl,triggers"
      comment: "Protect audit rows and the statement-level TRUNCATE path."
      changes:
        - sqlFile:
            path: 002_patient_audit_append_only.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/09_triggers/002_patient_audit_append_only.rollback.sql
            relativeToChangelogFile: true
  - changeSet:
      id: patients-ddl-triggers-003
      author: DanielPerez1822
      labels: "HU-PAT-001,idempotency,ddl,triggers"
      comment: "Protect replay identity, outcomes, timestamps and retention across DML paths."
      changes:
        - sqlFile:
            path: 003_idempotency_records_protection.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/09_triggers/003_idempotency_records_protection.rollback.sql
            relativeToChangelogFile: true
