name: CI

on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify rollback preflight regression cases
        run: python -B -m unittest discover -s tooling -p test_rollback_verification.py -v
      - name: Verify Patients migrations against disposable PostgreSQL
        run: python -B tooling/verify_migrations.py
  environment-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, qa, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify owner bootstrap and migration in disposable PostgreSQL
        run: python -B tooling/verify_migrations.py --environment=${{ matrix.environment }}
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify complete disposable database backup and recovery
        run: python -B tooling/verify_migrations.py --environment=dev --backup-restore
  synthetic-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, qa, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify synthetic seed isolation and recovery
        run: python -B tooling/verify_migrations.py --environment=${{ matrix.environment }} --synthetic-seeds
