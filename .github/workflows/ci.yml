name: CI

# Fast entry point (Norma 5.1, Annex I); the rebuild verification of Norma 5.2.8 runs in db-ci.yml.
on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile verification tooling
        run: python -m py_compile tooling/*.py
      - name: Run unit tests
        run: python -B -m unittest discover -s tooling -p "test_*.py" -v
